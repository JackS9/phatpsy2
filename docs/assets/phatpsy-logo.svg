<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-label="PHATPSY spin-pair logo">
  <defs>
    <linearGradient id="phatpsy-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <!-- gradient border (Tailwind: bg-gradient-to-br from-sky-400 to-orange-400, p-[1.5px], rounded-lg) -->
  <rect x="1" y="1" width="70" height="70" rx="16" fill="url(#phatpsy-border)"/>
  <!-- inner field (bg-slate-950, rounded-[7px]) -->
  <rect x="4" y="4" width="64" height="64" rx="13" fill="#020617"/>
  <!-- spin-up arrow (text-sky-400 #38bdf8) -->
  <path fill="#38bdf8" d="M27 22 L33.5 31.5 L29.6 31.5 L29.6 50 L24.4 50 L24.4 31.5 L20.5 31.5 Z"/>
  <!-- spin-down arrow (text-orange-400 #fb923c) -->
  <path fill="#fb923c" d="M45 50 L38.5 40.5 L42.4 40.5 L42.4 22 L47.6 22 L47.6 40.5 L51.5 40.5 Z"/>
</svg>
