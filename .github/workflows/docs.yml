# Build and deploy MkDocs user manual to GitHub Pages.
name: Deploy Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Fortran toolchain and BLAS/LAPACK
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends gfortran libopenblas-dev liblapack-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy scipy matplotlib pyyaml pytest meson ninja pypdf
          .venv/bin/pip install -r docs/requirements.txt
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Build native core, Python extension, and verify (canonical loop)
        run: bash make_build_test.sh

      - name: Build documentation with MkDocs
        run: |
          .venv/bin/mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
