# Fast 2-atom Ni2 bridge screening model for NO on Ni(100) (Ferromagnetic CAS(5e,6o) SZ/STO-6G)
title: NO on Ni2 Bridge Screening Model (N-Down, Ferromagnetic LocalizedVB CAS(5e,6o) SZ/STO-6G)
net_spin: 3
control:
  method: masked_vb
  vb_wavefunction: cas
  domain_mode: custom
  core_embedding: exact_backprojected
  environment_embedding: none
  integral_backend: sto_ng
  sto_ng_primitives: 6
  spin_unrestricted: false
  max_cycles: 300
  convergence: 1.0e-06
  default_basis: SZ
  vb_orbital_specs:
  - {role: inactive, atoms: [Ni1]}
  - {role: inactive, atoms: [Ni1]}
  - {role: inactive, atoms: [Ni1]}
  - {role: inactive, atoms: [Ni1]}
  - {role: active, atoms: [Ni1, N1, O1]}
  - {role: active, atoms: [Ni1, N1, O1]}
  - {role: inactive, atoms: [Ni2]}
  - {role: inactive, atoms: [Ni2]}
  - {role: inactive, atoms: [Ni2]}
  - {role: inactive, atoms: [Ni2]}
  - {role: active, atoms: [Ni2, N1, O1]}
  - {role: active, atoms: [Ni2, N1, O1]}
  - {role: inactive, atoms: [N1]}
  - {role: inactive, atoms: [O1]}
  - {role: inactive, atoms: [N1, O1]}
  - {role: inactive, atoms: [N1, O1]}
  - {role: inactive, atoms: [N1, O1, Ni1, Ni2]}
  - {role: active, atoms: [N1, O1, Ni1, Ni2]}
  - {role: active, atoms: [N1, O1, Ni1, Ni2]}
geometry:
- {id: Ni1, element: Ni, xyz: [-2.355, 0.0, 0.0], active: true, fixed: true, basis: SZ}
- {id: Ni2, element: Ni, xyz: [2.355, 0.0, 0.0], active: true, fixed: true, basis: SZ}
- {id: N1, element: N, xyz: [-0.000055, -0.000023, 1.765272], active: true, fixed: false, basis: SZ}
- {id: O1, element: O, xyz: [0.037459, 0.000009, 4.422723], active: true, fixed: false, basis: SZ}
