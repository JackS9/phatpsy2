# Embedded Ni4(active)/Ni9(spectator) FCC(100) 1-fold atop site over Ni1: N-down NO*
# Directly reconciles the legacy 1-fold top-site examples/NO_ni_100.yaml with the 1978 4-fold hollow site.
title: NO on Ni4/Ni9(100) 1-Fold Atop Site (N-Down, Ferromagnetic LocalizedVB CAS(9e,10o) SZ/STO-6G)
net_spin: 7
control:
  method: masked_vb
  vb_wavefunction: cas
  domain_mode: custom
  core_embedding: exact_backprojected
  environment_embedding: exact_backprojected
  integral_backend: sto_ng
  sto_ng_primitives: 6
  spin_unrestricted: false
  max_cycles: 300
  convergence: 1.0e-06
  default_basis: SZ
  vb_orbital_specs:
  - {role: inactive, atoms: [Ni1]}
  - {role: inactive, atoms: [Ni1]}
  - {role: inactive, atoms: [Ni1]}
  - {role: inactive, atoms: [Ni1]}
  - {role: active, atoms: [Ni1, N1, O1]}
  - {role: active, atoms: [Ni1, N1, O1]}
  - {role: inactive, atoms: [Ni2]}
  - {role: inactive, atoms: [Ni2]}
  - {role: inactive, atoms: [Ni2]}
  - {role: inactive, atoms: [Ni2]}
  - {role: active, atoms: [Ni2, N1, O1]}
  - {role: active, atoms: [Ni2, N1, O1]}
  - {role: inactive, atoms: [Ni3]}
  - {role: inactive, atoms: [Ni3]}
  - {role: inactive, atoms: [Ni3]}
  - {role: inactive, atoms: [Ni3]}
  - {role: active, atoms: [Ni3, N1, O1]}
  - {role: active, atoms: [Ni3, N1, O1]}
  - {role: inactive, atoms: [Ni4]}
  - {role: inactive, atoms: [Ni4]}
  - {role: inactive, atoms: [Ni4]}
  - {role: inactive, atoms: [Ni4]}
  - {role: active, atoms: [Ni4, N1, O1]}
  - {role: active, atoms: [Ni4, N1, O1]}
  - {role: inactive, atoms: [N1]}
  - {role: inactive, atoms: [O1]}
  - {role: inactive, atoms: [N1, O1]}
  - {role: inactive, atoms: [N1, O1]}
  - {role: inactive, atoms: [N1, O1, Ni1, Ni2, Ni3, Ni4]}
  - {role: active, atoms: [N1, O1, Ni1, Ni2, Ni3, Ni4]}
  - {role: active, atoms: [N1, O1, Ni1, Ni2, Ni3, Ni4]}
