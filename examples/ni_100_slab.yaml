title: Ni(100) 3-Layer Surface Slab (Surface, Subsurface, Fixed Bulk)
control:
  spin_unrestricted: true
  max_cycles: 25
  convergence: 0.0001
  time_limit: 360.0
  use_constrained_fit: false
  use_diis: false
  use_global_fermi: false
  fermi_temperature: null
  use_dynamic_exponents: false
  exchange_kernel: hartree-fock
  exchange_alpha: 0.6666666666666666
  separate_atoms_first_cycle: true
  debug: false
  trace: false
geometry:
- element: Ni
  xyz:
  - 0.0
  - 0.0
  - 0.0
  id: Ni_surf
  spin: up
- element: Ni
  xyz:
  - 3.326
  - 3.326
  - -3.326
  id: Ni_sub
  spin: down
- element: Ni
  xyz:
  - 0.0
  - 0.0
  - -6.652
  id: Ni_bulk_fixed
  fixed: true
  spin: up
elements:
  Ni:
    symbol: Ni
    atomic_number: 28
    basis: DZ
